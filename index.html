<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zhaowenguan-v2</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const BASE_PATH = "/";
        const ROUTE_PARAM = "__zhaowenguan_pages_route";
        // Keep this list aligned with src/App.tsx `paths`; profile children
        // are checked separately against src/mySections.ts by the build test.
        const KNOWN_APP_PATHS = new Set([
          "/",
          "/resources",
          "/detail",
          "/categories",
          "/tools",
          "/profile",
          "/tools/pdf-nup",
          "/tools/pdf-merge",
          "/tools/pdf-split",
          "/tools/images-to-pdf",
          "/tools/image-compress",
          "/tools/print-page-adjust",
          "/tools/image-sheet-layout",
          "/tools/pdf-page-organizer",
          "/tools/pdf-to-images",
          "/tools/pdf-compress",
          "/tools/ocr",
          "/tools/page-number",
          "/tools/watermark",
          "/tools/image-format-convert",
          "/tools/image-resize",
          "/about",
          "/guide",
          "/disclaimer",
          "/contact",
        ]);
        const KNOWN_PROFILE_PATHS = new Set([
          "/profile/overview",
          "/profile/favorites",
          "/profile/history",
          "/profile/downloads",
          "/profile/tools",
          "/profile/settings",
          "/profile/feedback",
          "/profile/about",
        ]);
        const baseWithoutTrailingSlash = BASE_PATH.slice(0, -1);
        const appPathFromLocation = (pathname) => {
          if (pathname === baseWithoutTrailingSlash || pathname === BASE_PATH) return "/";
          if (pathname.startsWith(BASE_PATH)) return `/${pathname.slice(BASE_PATH.length)}`;
          return pathname;
        };
        const knownAppPath = (pathname) => {
          if (typeof pathname !== "string" || pathname.includes("%")) return null;
          let decodedPathname;
          try {
            decodedPathname = decodeURIComponent(pathname);
          } catch {
            return null;
          }
          if (
            !decodedPathname.startsWith("/") ||
            decodedPathname.includes("\\") ||
            (decodedPathname !== "/" && decodedPathname.includes("//"))
          ) return null;
          const normalizedPath = decodedPathname.length > 1 && decodedPathname.endsWith("/")
            ? decodedPathname.slice(0, -1)
            : decodedPathname;
          if (normalizedPath !== "/" && normalizedPath.endsWith("/")) return null;
          return KNOWN_APP_PATHS.has(normalizedPath) || KNOWN_PROFILE_PATHS.has(normalizedPath)
            ? normalizedPath
            : null;
        };
        const restoreParams = new URLSearchParams(window.location.search);
        if (restoreParams.getAll(ROUTE_PARAM).length !== 1) return;
        const requestedRoute = restoreParams.get(ROUTE_PARAM);
        if (!requestedRoute) return;
        // Reject encoded path bytes before URL parsing can normalize dot segments.
        // Encoded query/hash values remain supported for legitimate searches.
        if (requestedRoute.split(/[?#]/, 1)[0].includes("%")) return;

        try {
          const target = new URL(requestedRoute, window.location.origin);
          const isWithinBase = target.pathname === baseWithoutTrailingSlash ||
            target.pathname.startsWith(BASE_PATH);
          const targetAppPath = appPathFromLocation(target.pathname);
          const hasNestedRestoreParam = new URLSearchParams(target.search).has(ROUTE_PARAM);
          if (
            target.origin !== window.location.origin ||
            !isWithinBase ||
            hasNestedRestoreParam ||
            !knownAppPath(targetAppPath)
          ) return;
          window.history.replaceState({}, "", `${target.pathname}${target.search}${target.hash}`);
        } catch {
          // Ignore malformed fallback state and let the normal home route render.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
