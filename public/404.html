<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面未找到 — 昭文馆</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f8ee;
        color: #163d2a;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 480px;
        padding: 32px 28px;
        background: #fffef8;
        border: 1px solid #e2e7d9;
        border-radius: 18px;
        text-align: center;
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 18px; color: #5f7665; line-height: 1.7; }
      a {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 999px;
        background: #2f704b;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>页面未找到</h1>
      <p id="not-found-status">正在恢复昭文馆页面……</p>
      <p id="not-found-home" hidden><a href="/">返回昭文馆首页</a></p>
    </main>
    <script>
      (() => {
        const BASE_PATH = "/";
        const ROUTE_PARAM = "__zhaowenguan_pages_route";
        // Keep this list aligned with src/App.tsx `paths`; profile children
        // are checked separately against src/mySections.ts by the build test.
        const KNOWN_APP_PATHS = new Set([
          "/",
          "/resources",
          "/detail",
          "/categories",
          "/junior-high/courses",
          "/high-school/courses",
          "/postgraduate/courses",
          "/skill-growth",
          "/tools",
          "/profile",
          "/tools/pdf-nup",
          "/tools/pdf-merge",
          "/tools/pdf-split",
          "/tools/images-to-pdf",
          "/tools/image-compress",
          "/tools/print-page-adjust",
          "/tools/image-sheet-layout",
          "/tools/pdf-page-organizer",
          "/tools/pdf-to-images",
          "/tools/pdf-compress",
          "/tools/ocr",
          "/tools/page-number",
          "/tools/watermark",
          "/tools/image-format-convert",
          "/tools/image-resize",
          "/about",
          "/guide",
          "/disclaimer",
          "/contact",
        ]);
        const KNOWN_PROFILE_PATHS = new Set([
          "/profile/overview",
          "/profile/favorites",
          "/profile/history",
          "/profile/downloads",
          "/profile/tools",
          "/profile/settings",
          "/profile/feedback",
          "/profile/about",
        ]);
        const pathname = window.location.pathname;
        const baseWithoutTrailingSlash = BASE_PATH.slice(0, -1);
        const isWithinBase = pathname === baseWithoutTrailingSlash || pathname.startsWith(BASE_PATH);
        const isBaseRequest = pathname === baseWithoutTrailingSlash || pathname === BASE_PATH;
        const appPathFromLocation = (locationPath) => {
          if (locationPath === baseWithoutTrailingSlash || locationPath === BASE_PATH) return "/";
          if (locationPath.startsWith(BASE_PATH)) return `/${locationPath.slice(BASE_PATH.length)}`;
          return locationPath;
        };
        const knownAppPath = (locationPath) => {
          if (typeof locationPath !== "string" || locationPath.includes("%")) return null;
          let decodedPathname;
          try {
            decodedPathname = decodeURIComponent(locationPath);
          } catch {
            return null;
          }
          if (
            !decodedPathname.startsWith("/") ||
            decodedPathname.includes("\\") ||
            (decodedPathname !== "/" && decodedPathname.includes("//"))
          ) return null;
          const normalizedPath = decodedPathname.length > 1 && decodedPathname.endsWith("/")
            ? decodedPathname.slice(0, -1)
            : decodedPathname;
          if (normalizedPath !== "/" && normalizedPath.endsWith("/")) return null;
          return KNOWN_APP_PATHS.has(normalizedPath) || KNOWN_PROFILE_PATHS.has(normalizedPath)
            ? normalizedPath
            : null;
        };

        // GitHub Pages serves this document with the original 404 status. Only
        // an explicitly supported app route may be recovered. Missing assets,
        // resource directories and unknown pages stay on this plain 404 page.
        if (!isWithinBase || isBaseRequest || !knownAppPath(appPathFromLocation(pathname))) {
          if (typeof document !== "undefined") {
            const status = document.getElementById("not-found-status");
            const homeLink = document.getElementById("not-found-home");
            if (status) status.textContent = "未找到该页面，请检查链接或返回首页继续浏览。";
            if (homeLink) homeLink.hidden = false;
          }
          return;
        }

        const requestedRoute = `${pathname}${window.location.search}${window.location.hash}`;
        const target = new URL(BASE_PATH, window.location.origin);
        const params = new URLSearchParams();
        params.set(ROUTE_PARAM, requestedRoute);
        target.search = params.toString();
        window.location.replace(target.href);
      })();
    </script>
  </body>
</html>
